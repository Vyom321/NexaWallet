<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexaWallet - Crypto Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="new.css" />
  <style>
    .output-section {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #2c3e50;
      color: white;
      font-size: 16px;
      white-space: pre-line;
      font-family: monospace;
    }
    .output-section.error {
      background: #c0392b;
    }
    .output-section.success {
      background: #27ae60;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">💼 NexaWallet</div>
      <button id="logout-btn" class="btn logout" onclick="logout()" style="display: none;">Logout</button>
    </nav>

    <!-- Authentication -->
    <section id="auth-section" class="card auth">
      <h2>🔐 Access NexaWallet</h2>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <div class="button-group">
        <button class="btn primary" onclick="register()">Register</button>
        <button class="btn secondary" onclick="login()">Login</button>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" class="dashboard" style="display: none;">
      <div class="dashboard-grid">

        <div class="card action" onclick="getBalance()">
          <img class="icon-img" src="https://img.icons8.com/dusk/64/000000/money.png" alt="balance">

        </div>
